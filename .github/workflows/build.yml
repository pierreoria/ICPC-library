name: Gerar PDF do KACTL

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar LaTeX e Python
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-recommended python3 make

      - name: Compilar o KACTL
        run: make kactl

      - name: Salvar o PDF
        uses: actions/upload-artifact@v4
        with:
          name: KACTL-PDF-Time
          path: kactl.pdf
